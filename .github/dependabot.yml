version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
    groups:
      # Open PRs for each major version and security update
      # Open an aggregate PR for all minor and patch version updates
      npm-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    groups:
      # Open an aggregate PR for all GitHub Actions updates
      github-actions:
        patterns:
          - "*"
    ignore:
      # Newer releases of guidepup/setup-action are not compatible with the
      # version of @guidepup/guidepup this repository uses, so this action is
      # pinned and has to be updated manually alongside @guidepup/guidepup.
      - dependency-name: "guidepup/setup-action"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
