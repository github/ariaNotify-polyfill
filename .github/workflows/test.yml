name: Test

on:
  workflow_call:
  pull_request:

permissions:
  contents: read

jobs:
  web-test-runner:
    name: Web Test Runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: npm
      - run: npm install -g npm@^11.0.0
      - run: npm ci
      - run: npm test
  guidepup-macos:
    name: Guidepup (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: npm
      - run: npm install -g npm@^11.0.0
      - run: npm ci
      - uses: guidepup/setup-action@5d19b1151e972898cae0f0cc44e239127953bd90
      - run: npm run test:guidepup
  guidepup-windows:
    name: Guidepup (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: npm
      - run: npm install -g npm@^11.0.0
      - run: npm ci
      - uses: guidepup/setup-action@5d19b1151e972898cae0f0cc44e239127953bd90
      # guidepup records the directory it installed NVDA into in the registry,
      # and that is where @guidepup/guidepup looks for it when running the
      # tests, so assert NVDA is there before running them.
      - name: Verify NVDA is installed
        run: |
          $registryKey = "HKCU:\Software\Guidepup\Nvda"
          if (-not (Test-Path $registryKey)) {
            throw "NVDA is not installed: registry key $registryKey is missing"
          }
          $nvdaRegistryKey = Get-Item -Path $registryKey
          $nvdaExecutablePath = $nvdaRegistryKey.GetValueNames() |
            Where-Object { $_ -like "guidepup_nvda_*" } |
            ForEach-Object { Join-Path $nvdaRegistryKey.GetValue($_) "nvda.exe" } |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if (-not $nvdaExecutablePath) {
            throw "NVDA is not installed: no nvda.exe found in any directory registered under $registryKey"
          }
          Write-Host "Found NVDA at $nvdaExecutablePath"
      - run: npm run test:guidepup
