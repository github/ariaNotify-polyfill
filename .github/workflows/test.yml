name: Test

on:
  workflow_call:
  pull_request:

permissions:
  contents: read

jobs:
  web-test-runner:
    name: Web Test Runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: npm
      - run: npm install -g npm@^11.0.0
      - run: npm ci
      - run: npm test
  guidepup-macos:
    name: Guidepup (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: npm
      - run: npm install -g npm@^11.0.0
      - run: npm ci
      - run: npx @guidepup/setup@0.25.2 setup --ci
      - run: npx @guidepup/setup@0.25.2 install
      - run: npm run test:guidepup
  guidepup-windows:
    name: Guidepup (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: npm
      - run: npm install -g npm@^11.0.0
      - run: npm ci
      - run: npx @guidepup/setup@0.25.2 setup --ci
      - run: npx @guidepup/setup@0.25.2 install
      - run: npm run test:guidepup
