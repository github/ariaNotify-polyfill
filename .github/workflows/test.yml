name: Test

on:
  workflow_call:
  pull_request:

permissions:
  contents: read

jobs:
  web-test-runner:
    name: Web Test Runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: npm
      - run: npm install -g npm@^11.0.0
      - run: npm ci
      - run: npm test
  guidepup-macos:
    name: Guidepup (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: npm
      - run: npm install -g npm@^11.0.0
      - run: npm ci
      - uses: guidepup/setup-action@5d19b1151e972898cae0f0cc44e239127953bd90
      - run: npm run test:guidepup
  guidepup-windows:
    name: Guidepup (Windows)
    runs-on: windows-latest
    env:
      NVDA_INSTALL_DIR: C:\nvda
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: npm
      - run: npm install -g npm@^11.0.0
      - run: npm ci
      # - from copilot:
      #  changed Windows CI to enforce setup instead: 
      #  guidepup/setup-action now installs NVDA into a deterministic path (C:\nvda) 
      #  and the workflow explicitly verifies nvda.exe exists before running npm run test:guidepup
      - uses: guidepup/setup-action@5d19b1151e972898cae0f0cc44e239127953bd90
        with:
          nvdaInstallDir: ${{ env.NVDA_INSTALL_DIR }}
      - run: |
          $nvdaExecutablePath = Join-Path $env:NVDA_INSTALL_DIR "nvda.exe"
          if (-not (Test-Path $nvdaExecutablePath)) {
            throw "NVDA executable not found at $nvdaExecutablePath"
          }
      - run: npm run test:guidepup
